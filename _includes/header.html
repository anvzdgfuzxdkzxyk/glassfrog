<header class="site-header" id="top">
    <nav class="desktop-site-nav" aria-label="Primary"> <!---Using desktop site nav to make adding mobile nav later easier and avoid an entire refactor of the relevant code-->
        <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Home">
            <img src="{{ '/assets/images/logo.svg' | relative_url }}"
                 alt="justanewdev logo">
        </a>

        <ul class="primary-nav">
            {% for item in site.data.navigation %}
                <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</header>
